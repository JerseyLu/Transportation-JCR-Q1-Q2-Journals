// ---- Official sites. Elsevier pages follow a stable ScienceDirect slug pattern; others are listed explicitly.
const slugOverride = {
  "Omega – The International Journal of Management Science": "omega",
  "Transportation Research Part F: Traffic Psychology and Behaviour": "transportation-research-part-f-traffic-psychology-and-behaviour"
};
const siteMap = {
  "npj Urban Sustainability": "https://www.nature.com/npjurbansustain/",
  "npj Sustainable Mobility and Transport": "https://www.nature.com/npjsumtra/",
  "IEEE Transactions on Intelligent Transportation Systems": "https://ieee-itss.org/pub/t-its/",

  "Transportmetrica A: Transport Science": "https://www.tandfonline.com/journals/ttra20",
  "Transportmetrica B: Transport Dynamics": "https://www.tandfonline.com/journals/ttrb20",
  "Environment and Planning B: Urban Analytics and City Science": "https://journals.sagepub.com/home/epb",
  "Urban Studies": "https://journals.sagepub.com/home/usj",
  "Transportation Research Record": "https://journals.sagepub.com/home/trr",
  "Transportation Letters": "https://www.tandfonline.com/journals/ytrl20",
  "Journal of Intelligent Transportation Systems": "https://www.tandfonline.com/journals/gits20",

};
const statsMap = {
  "Transportation Science": "https://pubsonline.informs.org/authorportal/journal-metrics/transportation-science"
};
const goldOA = ["npj Urban Sustainability","npj Sustainable Mobility and Transport","Transportation Research Interdisciplinary Perspectives","Journal of Transport and Land Use"];
function elsSlug(n) {
  return slugOverride[n] || n.toLowerCase().replace(/&/g, "and").replace(/[:,]/g, "").replace(/\s+/g, "-");
}
function siteUrl(j) {
  return siteMap[j.name] || `https://www.sciencedirect.com/journal/${elsSlug(j.name)}`;
}
function statsUrl(j) {
  if (statsMap[j.name]) return statsMap[j.name];
  return j.pub === "Elsevier" ? `https://www.sciencedirect.com/journal/${elsSlug(j.name)}/about/insights` : null;
}
function oaType(j) { return goldOA.includes(j.name) ? "gold" : "hybrid"; }

const i18n = {
  zh: {
    pageTitle: "交通领域JCR Q1 & Q2期刊数据表",
    filters: {
      all: "全部", stat: "交通统计建模", causal: "因果推断", spatial: "空间计量",
      sharing: "共享出行", bigdata: "交通大数据", ml: "机器学习/AI", or: "运筹优化"
    },
    tableHeaders: {
      journal: "期刊", if: "IF (2024)", cs: "CiteScore", jcr: "JCR",
      scope: "研究方向", sci: "SCI类别", pub: "出版社", oa: "开放获取", stats: "录用率/审稿时长"
    },
    oaLabel: { gold: "完全OA", hybrid: "订阅+OA可选" },
    statsLink: "官方数据 ↗",
    tierAll: "Q1 + Q2",
    noData: "该方向暂无匹配期刊",
    totalTpl: (n) => `共 ${n} 种期刊`,
    badges: { top: "中科院 TOP", nature: "Nature子刊" },
    tags: {
      stat: "统计建模", causal: "因果推断", spatial: "空间计量",
      sharing: "共享出行", bigdata: "大数据", ml: "ML/AI", or: "运筹优化"
    },
    legendTitle: "研究方向：",
    note: "* IF数据来源：2025年JCR报告（反映2024年影响因子）。CiteScore为Scopus数据。部分期刊IF以Scopus CiteScore综合估算；Q2期刊的IF为区间估计（≈），分区与IF请以官方JCR为准。期刊名可点击跳转官网。「录用率/审稿时长」列链接至出版社官方期刊指标页（Elsevier Journal Insights 等），录用率、首次决定时间等因刊而异、且多数期刊不公开，故不在表内列出具体数值，请以官方页面为准。开放获取模式为常规情况，投稿前请核对官网。",
    newJournal: "新刊"
  },
  en: {
    pageTitle: "Transportation JCR Q1 & Q2 Journals Data Table",
    filters: {
      all: "All", stat: "Statistical Modeling", causal: "Causal Inference", spatial: "Spatial Econometrics",
      sharing: "Shared Mobility", bigdata: "Transport Big Data", ml: "Machine Learning/AI", or: "Operations Research"
    },
    tableHeaders: {
      journal: "Journal", if: "IF (2024)", cs: "CiteScore", jcr: "JCR",
      scope: "Research Direction", sci: "SCI Category", pub: "Publisher", oa: "Open Access", stats: "Acceptance rate / speed"
    },
    oaLabel: { gold: "Fully OA", hybrid: "Hybrid" },
    statsLink: "Official stats ↗",
    tierAll: "Q1 + Q2",
    noData: "No matching journals for this direction",
    totalTpl: (n) => `Total ${n} journals`,
    badges: { top: "CAS TOP", nature: "Nature Portfolio" },

      stat: "Statistical", causal: "Causal", spatial: "Spatial",

    },

    newJournal: "New"
  }
};

const tagClasses = {
  stat: "tag-stat", causal: "tag-causal", spatial: "tag-spatial",
  sharing: "tag-sharing", bigdata: "tag-bigdata", ml: "tag-ml", or: "tag-or"
};

let currentLang = "zh";
let currentFilter = "all";
let currentTier = "all";

function updateStrings() {
  const langObj = i18n[currentLang];
  
  // Title & Note
  document.getElementById("pageTitle").textContent = langObj.pageTitle;
  document.getElementById("pageNote").textContent = langObj.note;
  
  // Filters
  document.getElementById("btn_all").textContent = langObj.filters.all;
  document.getElementById("btn_stat").textContent = langObj.filters.stat;
  document.getElementById("btn_causal").textContent = langObj.filters.causal;
  document.getElementById("btn_spatial").textContent = langObj.filters.spatial;
  document.getElementById("btn_sharing").textContent = langObj.filters.sharing;
  document.getElementById("btn_bigdata").textContent = langObj.filters.bigdata;
  document.getElementById("btn_ml").textContent = langObj.filters.ml;
  document.getElementById("btn_or").textContent = langObj.filters.or;
  
  // Table Headers
  document.getElementById("th_journal").textContent = langObj.tableHeaders.journal;
  document.getElementById("th_if").textContent = langObj.tableHeaders.if;
  document.getElementById("th_cs").textContent = langObj.tableHeaders.cs;
  document.getElementById("th_jcr").textContent = langObj.tableHeaders.jcr;
  document.getElementById("th_scope").textContent = langObj.tableHeaders.scope;
  document.getElementById("th_sci").textContent = langObj.tableHeaders.sci;
  document.getElementById("th_pub").textContent = langObj.tableHeaders.pub;
  document.getElementById("th_oa").textContent = langObj.tableHeaders.oa;
  document.getElementById("th_stats").textContent = langObj.tableHeaders.stats;
  document.getElementById("tier_all").textContent = langObj.tierAll;
  document.documentElement.lang = currentLang;
  document.title = langObj.pageTitle;
  
  // Legend
  document.getElementById("legendTitle").textContent = langObj.legendTitle;
  for (const k in langObj.tags) {
    document.getElementById(`lg_${k}`).textContent = langObj.tags[k];
  }
  
  // No data msg
  document.getElementById("noData").textContent = langObj.noData;
}

function renderTable() {
  const tbody = document.getElementById("tbody");
  const noData = document.getElementById("noData");
  const stats = document.getElementById("stats");
  const langObj = i18n[currentLang];

  const tierRank = j => (j.jcr === "Q2" ? 1 : 0);
  const sorted = [...journals].sort((a, b) => {
    if (tierRank(a) !== tierRank(b)) return tierRank(a) - tierRank(b);
    const ia = typeof a.if === "number" ? a.if : 0;
    const ib = typeof b.if === "number" ? b.if : 0;
    return ib - ia;
  });

  const filtered = sorted
    .filter(j => currentFilter === "all" || j.tags.includes(currentFilter))
    .filter(j => currentTier === "all" || j.jcr.startsWith(currentTier));

  tbody.innerHTML = "";
  if (filtered.length === 0) {
    noData.style.display = "block";
    stats.textContent = "";
    return;
  }
  noData.style.display = "none";
  stats.textContent = langObj.totalTpl(filtered.length);

  filtered.forEach((j) => {
    const tr = document.createElement("tr");
    const ifStr = typeof j.if === "number" ? j.if.toFixed(1) : (j.if === "新刊" ? langObj.newJournal : j.if);

    const badges = [];
    badges.push(`<span class="badge ${j.jcr === "Q2" ? "badge-q2" : "badge-q1"}">${j.jcr}</span>`);
    if (j.top) badges.push(`<span class="badge badge-top">${langObj.badges.top}</span>`);
    if (j.nature) badges.push(`<span class="badge badge-nature">${langObj.badges.nature}</span>`);

    const tagHtml = j.tags.map(t => `<span class="tag ${tagClasses[t]}">${langObj.tags[t]}</span>`).join("");
    const scopeStr = j.scope[currentLang];

    tr.innerHTML = `
      <td><a class="journal-name" href="${siteUrl(j)}" target="_blank" rel="noopener noreferrer">${j.name}</a></td>
      <td><span class="if-val">${ifStr}</span></td>
      <td><span class="cite-val">${j.cs}</span></td>
      <td>${badges.join("")}</td>
      <td>${tagHtml}<br><span style="font-size:11px;color:#777;margin-top:4px;display:inline-block">${scopeStr}</span></td>
      <td><span style="font-size:11px;color:#777;">${j.sci}</span></td>
      <td><span class="publisher">${j.pub}</span></td>
      <td><span class="oa ${oaType(j) === "gold" ? "oa-gold" : ""}">${langObj.oaLabel[oaType(j)]}</span></td>
      <td>${statsUrl(j) ? `<a class="ext" href="${statsUrl(j)}" target="_blank" rel="noopener noreferrer">${langObj.statsLink}</a>` : "—"}</td>
    `;
    tbody.appendChild(tr);
  });
}

// Bind Lang switchers
document.querySelectorAll(".lang-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentLang = btn.dataset.lang;
    updateStrings();
    renderTable();
  });
});

// Bind Filters
document.querySelectorAll(".filter-btn[data-filter]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn[data-filter]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.filter;
    renderTable();
  });
});

document.querySelectorAll(".tier-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tier-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentTier = btn.dataset.tier;
    renderTable();
  });
});

// Initial Render
updateStrings();
renderTable();
</script>
